<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RUBIN — Hero scroll prototype</title>
    <link rel="stylesheet" href="./loader.css" />
    <link rel="stylesheet" href="./hero.css" />
  </head>
  <body>
    <div class="site-loader" role="status" aria-live="polite" aria-label="Загрузка">
      <svg class="site-loader__star" width="49" height="76" viewBox="0 0 49 76" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g class="star-pair" data-pair="0">
          <path d="M20 37.5L24.5 0L29 37.5L24.5 76L20 37.5Z" fill="currentColor"/>
        </g>
        <g class="star-pair" data-pair="1">
          <path d="M26.5 34L0 24L22.5 42L49 52L26.5 34Z" fill="currentColor"/>
        </g>
        <g class="star-pair" data-pair="2">
          <path d="M26.5 42L0 52L22.5 34L49 24L26.5 42Z" fill="currentColor"/>
        </g>
      </svg>
    </div>

    <section class="hero-scroll" aria-label="Hero">
      <div class="hero-pin">
        <canvas class="hero-canvas" aria-hidden="true"></canvas>
        <div class="stage__scrim" aria-hidden="true"></div>

        <header class="nav">
          <a class="nav__logo" href="#" aria-label="Rubin">
            <img src="../assets/landing/logo.svg" alt="Rubin" width="120" height="38" />
          </a>
          <nav class="nav__mid" aria-label="Основное">
            <a href="#product">Продукт</a>
            <a href="#exchange">Биржа</a>
            <a href="#how">Как устроено</a>
            <a href="#transparency">Прозрачность</a>
            <a href="#news">Новости</a>
            <a href="#beginners" class="is-medium">Для новичков</a>
          </nav>
          <a class="nav__cta" href="#trade">Начать торговлю</a>
        </header>

        <div class="copy">
          <h1>Perp DEX-биржа на собственном L1</h1>
          <p>
            Топовые пары, плечо до 5x и пополнение в USDC — без лишних шагов и
            старой логики CEX
          </p>
        </div>

        <p class="hero-status">Загрузка…</p>
      </div>
    </section>

    <section class="after">
      <p>Дальше лендинг — pin отпущен.</p>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="./hero.config.js"></script>
    <script src="./loader.js"></script>
    <script src="./hero.js"></script>
  </body>
</html>
